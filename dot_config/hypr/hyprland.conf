bind = $mainMod ALT, KP_Right, workspace, 6

bind = $mainMod ALT, KP_7, movetoworkspace, 7
bind = $mainMod ALT, KP_Home, workspace, 7

bind = $mainMod ALT, KP_8, movetoworkspace, 8
