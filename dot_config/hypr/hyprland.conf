bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

bind = $mainMod, Escape, exec, /home/ennio.octavio/.local/bin/power-menu

bind = $mainMod SHIFT, D, exec, swaync-client -t -sw
bind = $mainMod SHIFT, E, exec, hyprctl dispatch exit
bind = $mainMod SHIFT, N, exec, /home/ennio.octavio/.local/bin/cycle-ws move 
bind = $mainMod SHIFT, Q, exec, systemctl suspend
#bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" /tmp/screenshot_active.png && swappy -f /tmp/screenshot_active.png
bind = $mainMod SHIFT, S, exec, ~/.local/bin/print-area.sh

bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -p "󰅌 Clipboard" | cliphist decode | wl-copy
bind = $mainMod SHIFT, Left, movewindow, mon:l
bind = $mainMod SHIFT, Right, movewindow, mon:r

