# #######################################################################################
# HYPRLAND CONFIG - COMPLETO E OTIMIZADO
# #######################################################################################

################
### MONITORS ###
################
# Importa automaticamente as regras baseadas na localização física
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

# Fallback de segurança universal
monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun

#################
### AUTOSTART ###
#################
# Verifica o estado da tampa no boot (se fechada, desativa o eDP-1 para o trabalho)
exec = bash -c 'sleep 1 && grep -iq closed /proc/acpi/button/lid/*/state && hyprctl keyword monitor "eDP-1, disable"'

# 1. PREPARAÇÃO DO AMBIENTE E SERVIÇOS CORE (O "Chão")
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/libexec/hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = ~/.local/bin/detect-workspaces.sh

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 2. INTERFACE E APLICATIVOS DE BACKGROUND (A "Casa")
exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = fcitx5 -d
exec-once = libinput-gestures
exec-once = pasystray

# Inicia o último wallpaper configurado para o ambiente atual
exec-once = ~/.config/hypr/start-wall.sh

# Mantém apenas os últimos 10 clips, tanto para texto quanto para imagens
exec-once = wl-paste --type text --watch bash -c 'cliphist store && cliphist list | tail -n +11 | cliphist delete'
exec-once = wl-paste --type image --watch bash -c 'cliphist store && cliphist list | tail -n +11 | cliphist delete'

exec-once = hyprpm reload -n && sleep 0.5 && hyprctl reload

# Inicia o terminal do scratchpad diretamente no espaço especial de forma silenciosa
exec-once = [workspace special:scratchpad silent] kitty --class kitty-scratchpad

# Inicia o servidor de pop-ups (Volume/Brilho/Capslock)
exec-once = swayosd-server

# Carrega o Hyprspace compilado manualmente
exec-once = hyprctl plugin load /home/ennio.octavio/.local/share/Hyprspace/Hyprspace.so

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Força a composição do cedilha correto no GTK e QT via .XCompose
env = XCOMPOSEFILE,/home/ennio.octavio/.XCompose
env = FCITX_NO_WAYLAND_DIAGNOSE,1
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(00ffffee) rgba(ff007cee) 45deg
    col.inactive_border = rgba(11111baa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 10
        render_power = 1
        color = rgba(8800ff66)         # Roxo neon de transição
        color_inactive = rgba(00000000)
    }
        
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = ultraFast, 0.1, 1, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    #animation = workspaces, 1, 1.94, almostLinear, fade
    # Para (deslize suave ou deslize com leve fade):
    animation = workspaces, 1, 3, easeOutQuint, slide
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

plugin {
    overview {
        # Esconde workspaces vazios e novos no painel superior
        showEmptyWorkspace = false
        showNewWorkspace = false
        drawActiveWorkspace = true

        # Estilo e espaçamento
        panelColor = rgba(17, 17, 27, 0.8)
        panelBorderColor = rgba(0, 255, 255, 0.8)
        workspaceMargin = 15
        workspaceBorderSize = 2
        overrideGaps = true
        gapsIn = 5
        gapsOut = 15

        # Comportamento de saída
        exitOnClick = true
        exitOnSwitch = true
    }

    hyprfocus {
        enabled = yes
        animate_floating = yes
        animate_workspacechange = yes

        keyboard_focus_animation = shrink
        mouse_focus_animation = flash

        shrink {
            shrink_percentage = 0.95
            in_bezier = ultraFast
            in_speed = 0.1
            out_bezier = ultraFast
            out_speed = 0.5
        }

        flash {
            flash_opacity = 0.7
            in_bezier = ultraFast
            in_speed = 0.1
            out_bezier = ultraFast
            out_speed = 0.8
        }
    }
}
#######################################
### SCRATCHPAD (terminal invisivel) ###
#######################################
windowrule = workspace special:scratchpad, match:class ^(kitty-scratchpad)$

#######################################
### TRANSLUCIDEZ DE JANELAS ESPECÍFICAS
#######################################
windowrule = opacity 0.95 0.90 0.95, match:class ^(org.gnome.Nautilus)$
windowrule = opacity 0.95 0.90 0.95, match:class ^(Slack|slack)$
windowrule = opacity 0.95 0.90 0.95, match:class ^(google-chrome)$
windowrule = opacity 0.95 0.90 0.95, match:class ^(Spotify|spotify)$
windowrule = opacity 0.95 0.90 0.95, match:class ^(kitty)$

#######################################
### REGRAS AVANÇADAS DE JANELAS
#######################################
# Picture-in-Picture flutuante, fixado no canto inferior direito
windowrule = float on, match:title ^(Picture-in-picture|Picture-in-Picture|Painel no painel)$
windowrule = pin on, match:title ^(Picture-in-picture|Picture-in-Picture|Painel no painel)$
windowrule = size 25% 25%, match:title ^(Picture-in-picture|Picture-in-Picture|Painel no painel)$
windowrule = move 74% 74%, match:title ^(Picture-in-picture|Picture-in-Picture|Painel no painel)$

# Diálogos de sistema, seletores de arquivos e utilitários sempre flutuantes
windowrule = float on, match:class ^(org.gnome.FileRoller)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:title ^(Open File|Save File|Confirm to replace files|Abrir arquivo|Salvar arquivo)$

# Isolamento do bridge de compartilhamento de tela (Slack/Meet/Discord)
windowrule = opacity 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = float on, match:class ^(xwaylandvideobridge)$
windowrule = size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = move -2000 -2000, match:class ^(xwaylandvideobridge)$

# Janelas de notificação e popups de WebApps (WhatsApp e Telegram Web)
windowrule = float on, match:title ^(.*(WhatsApp|web\.whatsapp\.com|Telegram|web\.telegram\.org).*)$
windowrule = pin on, match:title ^(.*(WhatsApp|web\.whatsapp\.com|Telegram|web\.telegram\.org).*)$
windowrule = size 360 120, match:title ^(.*(WhatsApp|web\.whatsapp\.com|Telegram|web\.telegram\.org).*)$
windowrule = move 74% 5%, match:title ^(.*(WhatsApp|web\.whatsapp\.com|Telegram|web\.telegram\.org).*)$

############%
### INPUT ###
#############
input {
    kb_layout = us,br
    kb_variant = intl,
    kb_model = pc105
    kb_options = grp:ctrl_space_toggle
    numlock_by_default = true

    follow_mouse = 1
    natural_scroll = true

    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe_distance = 200
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 10
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
    workspace_swipe_use_r = true
}

###################
### KEYBINDINGS ###
###################
