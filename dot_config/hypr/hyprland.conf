# #######################################################################################
# HYPRLAND CONFIG - COMPLETO E OTIMIZADO
# #######################################################################################

################
### MONITORS ###
################
# Importa automaticamente as regras baseadas na localização física
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

# Fallback de segurança universal
monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun

#################
### AUTOSTART ###
#################
# Verifica o estado da tampa no boot (se fechada, desativa o eDP-1 para o trabalho)
exec = bash -c 'sleep 1 && grep -iq closed /proc/acpi/button/lid/*/state && hyprctl keyword monitor "eDP-1, disable"'

# 1. PREPARAÇÃO DO AMBIENTE E SERVIÇOS CORE (O "Chão")
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/libexec/hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=secrets

# 2. INTERFACE E APLICATIVOS DE BACKGROUND (A "Casa")
exec-once = sleep 1 && waybar
exec-once = dunst
exec-once = hypridle
exec-once = fcitx5 -d

# Inicia o último wallpaper configurado para o ambiente atual
exec-once = ~/.config/hypr/start-wall.sh

# Mantém apenas os últimos 10 clips, tanto para texto quanto para imagens
exec-once = wl-paste --type text --watch bash -c 'cliphist store && cliphist list | tail -n +11 | cliphist delete'
exec-once = wl-paste --type image --watch bash -c 'cliphist store && cliphist list | tail -n +11 | cliphist delete'

exec-once = hyprpm reload -n && sleep 0.5 && hyprctl reload

# Inicia o terminal do scratchpad diretamente no espaço especial de forma silenciosa
exec-once = [workspace special:scratchpad silent] kitty --class kitty-scratchpad

# Inicia o servidor de pop-ups (Volume/Brilho/Capslock)
exec-once = swayosd-server

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Força a composição do cedilha correto no GTK e QT via .XCompose
env = XCOMPOSEFILE,/home/ennio.octavio/.XCompose
env = FCITX_NO_WAYLAND_DIAGNOSE,1
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(00ffffee) rgba(ff007cee) 45deg
    col.inactive_border = rgba(11111baa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 10
        render_power = 1
        color = rgba(8800ff66)         # Roxo neon de transição
        color_inactive = rgba(00000000)
    }
        
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = ultraFast, 0.1, 1, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current
        enable_action = true
    }

    hyprfocus {
        enabled = yes
        animate_floating = yes
        animate_workspacechange = yes

        # Sintaxe nova obrigatória nas versões recentes do hyprfocus
        keyboard_focus_animation = shrink
        mouse_focus_animation = flash

        # Configuração do efeito "Shrink" (Encolher)
        shrink {
            shrink_percentage = 0.95
            in_bezier = ultraFast
            in_speed = 0.1
            out_bezier = ultraFast
            out_speed = 0.5
        }

        # Configuração do efeito "Flash" (Piscar)
        flash {
            flash_opacity = 0.7
            in_bezier = ultraFast
            in_speed = 0.1
            out_bezier = ultraFast
            out_speed = 0.8
        }
    }
}

#######################################
### SCRATCHPAD (terminal invisivel) ###
#######################################
windowrule = workspace special:scratchpad, match:class ^(kitty-scratchpad)$

#######################################
### TRANSLUCIDEZ DE JANELAS ESPECÍFICAS
#######################################
windowrule = opacity 0.95 0.90 0.95, match:class ^(org.gnome.Nautilus)$
windowrule = opacity 0.95 0.90 0.95, match:class ^(Slack|slack)$
windowrule = opacity 0.95 0.90 0.95, match:class ^(google-chrome)$
windowrule = opacity 0.95 0.90 0.95, match:class ^(Spotify|spotify)$
windowrule = opacity 0.95 0.90 0.95, match:class ^(kitty)$

#############  
### INPUT ###
#############
input {
    kb_layout = us,br
    kb_variant = intl,
    kb_model = pc105
    kb_options = grp:ctrl_space_toggle
    numlock_by_default = true

    follow_mouse = 1
    natural_scroll = true

    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, K, exec, qalculate-gtk
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, N, exec, /home/ennio.octavio/.local/bin/cycle-ws
bind = $mainMod, P, layoutmsg, togglesplit
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod, V, togglefloating,
bind = $mainMod, W, hyprexpo:expo, toggle

bind = $mainMod, code:49, exec, $terminal

bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, period, exec, ~/.local/bin/rofimoji --action copy

bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

bind = $mainMod, Escape, exec, /home/ennio.octavio/.local/bin/power-menu

bind = $mainMod SHIFT, E, exec, hyprctl dispatch exit
bind = $mainMod SHIFT, N, exec, /home/ennio.octavio/.local/bin/cycle-ws move 
bind = $mainMod SHIFT, Q, exec, systemctl suspend
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" /tmp/screenshot_active.png && swappy -f /tmp/screenshot_active.png
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -p "󰅌 Clipboard" | cliphist decode | wl-copy
bind = $mainMod SHIFT, Left, movewindow, mon:l
bind = $mainMod SHIFT, Right, movewindow, mon:r

bind = $mainMod CTRL, Left, movewindow, l
bind = $mainMod CTRL, Right, movewindow, r
bind = $mainMod CTRL, Up, movewindow, u
bind = $mainMod CTRL, Down, movewindow, d

# Envia a janela que está em foco (Slack, Chrome, etc) para o scratchpad
bind = $mainMod CTRL, S, movetoworkspace, special:scratchpad

bind = CTRL SHIFT, P, exec, grim -g "$(slurp)" /tmp/screenshot_active.png && swappy -f /tmp/screenshot_active.png

bind = $mainMod ALT, Left, workspace, m-1
bind = $mainMod ALT, Right, workspace, m+1

bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

# Abre um NOVO terminal dividindo a tela dentro do scratchpad
bind = $mainMod ALT, S, exec, [workspace special:scratchpad] kitty --class kitty-scratchpad

# Atalho para apagar um item específico do histórico
bind = $mainMod ALT, V, exec, cliphist list | rofi -dmenu -multi-select -p "🗑️ Excluir" | cliphist delete

bind = , Print, exec, grim -g "$(slurp)" /tmp/screenshot_active.png && swappy -f /tmp/screenshot_active.png

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl reload

bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower
