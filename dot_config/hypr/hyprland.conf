# Abre um NOVO terminal dividindo a tela dentro do scratchpad
bind = $mainMod ALT, S, exec, [workspace special:scratchpad] kitty --class kitty-scratchpad

# Atalho para apagar um item específico do histórico
bind = $mainMod ALT, V, exec, cliphist list | rofi -dmenu -multi-select -p "🗑️ Excluir" | cliphist delete

#bind = , Print, exec, grim -g "$(slurp)" /tmp/screenshot_active.png && swappy -f /tmp/screenshot_active.png
bind = , Print, exec, ~/.local/bin/print-area.sh

bindm = $mainMod, mouse:272, movewindow
